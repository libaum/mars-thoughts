name: mars_thoughts
description: "Mars Thoughts — capture a thought before it disappears."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.4
  get_it: ^9.0.0
  url_launcher: ^6.3.0
  flutter_colorpicker: ^1.1.0
  # Personal flavor only — see lib/sync/sync_flags.dart. The store flavor
  # compiles the whole sync code path out behind a const flag.
  mars_sync:
    path: ../mars_sync
  # SyncService, key store and pairing screen, shared by every synced app.
  mars_sync_flutter:
    path: ../mars_sync_flutter
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter_native_splash:
  color: "#000000"
  image: assets/icon_fg.png
  color_dark: "#000000"
  image_dark: assets/icon_fg.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#000000"
    image: assets/icon_fg.png
    color_dark: "#000000"
    image_dark: assets/icon_fg.png

flutter:
  uses-material-design: true

  assets:
    - assets/splash_logo.png

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-VariableFont_wght.ttf
