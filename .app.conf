# Einstellungen für `app` (~/.local/bin/app), ersetzt install_release.sh
#   app . release                    Store-Flavor (Play-Store-App)
#   app . release --flavor personal  private Version mit Sync
FLAVOR="${FLAVOR:-store}"
# Bisherige Archiv-Namen beibehalten, damit restore alte APKs findet
if [[ "$FLAVOR" == personal ]]; then ARCHIVE_PREFIX=mars-personal; else ARCHIVE_PREFIX=mars; fi
